    mastercard: /cards is the card-number update service (account updater)
    korapay: /charges/card charges a card
    razorpay: /payments/{id}/card is the card used on a payment
    toss-payments: /billing/authorizations/card registers a billing card
    processout: /cards tokenizes a card for payment
    tabapay: /cards stores a card for push-to-card payouts
    payabli: /MoneyOutCard pays out to a card
    coinflow: /customer/card is a customer's saved card
    culqi: /cards are saved cards (tokens for charges)
    layup-technologies: /cards are saved cards for debit orders
    plug: /cards are saved cards for charges
    six-group: Click to Pay card enrolment
    evervault: /payments/cards are vaulted cards for payment
    chargebee: /cards are subscription billing cards
    openpay: /{merchant}/cards are saved cards
    helcim: saved cards
    interchecks: payee accounts, not issued cards
    verifone: /card is a card-on-file token
    lemonway: /moneyins/card is a pay-in card
    mangopay: /cards are registered pay-in cards
    affirm: a single-use virtual card minted for one checkout is a payment instrument, not an issuing programme
